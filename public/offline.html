<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0b" />
<title>Hors ligne · Propel</title>
<style>
  html, body { height: 100%; margin: 0; background: #050505; color: #fafafa; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 28px; letter-spacing: -0.03em; margin: 20px 0 8px; }
  p { color: rgba(250, 250, 250, 0.6); margin: 0 0 24px; max-width: 34ch; line-height: 1.5; }
  button { height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: #fafafa; color: #050505; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" width="72" height="72" alt="" style="border-radius: 18px" />
    <h1>Pas de connexion</h1>
    <p>Le dashboard a besoin d'internet pour lire tes données. Reviens dès que la connexion est rétablie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</main>
</body>
</html>
